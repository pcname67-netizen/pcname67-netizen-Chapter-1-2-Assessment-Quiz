<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chapter 1 &amp; 2 Assessment Quiz</title>
<style>
  /* =====================================================================
     DESIGN TOKENS  (change colors here to re-theme the whole quiz)
     ===================================================================== */
  :root {
    --navy-900: #0a1f44;
    --navy-800: #102a5c;
    --navy-700: #1b3a7a;
    --blue-600: #2563c9;
    --blue-500: #3b7ae0;
    --blue-200: #c7dafa;
    --blue-100: #e3edfc;
    --blue-50:  #f1f6fe;
    --page-bg:  #f3f6fb;
    --card-bg:  #ffffff;
    --line:     #d9e2f1;
    --text:     #14233f;
    --text-soft:#5a6b88;
    --good:     #1b8a5a;
    --good-bg:  #e4f6ed;
    --bad:      #c23b3b;
    --bad-bg:   #fdeaea;
    --warn:     #9a6700;
    --warn-bg:  #fff4d6;
    --radius:   14px;
    --shadow:   0 1px 2px rgba(10, 31, 68, .06), 0 6px 20px rgba(10, 31, 68, .06);
    --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: var(--font);
    color: var(--text);
    background: var(--page-bg);
    line-height: 1.55;
  }
  button { font-family: inherit; }
  :focus-visible { outline: 3px solid var(--blue-500); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* ---------- Header ---------- */
  .site-header {
    background: linear-gradient(135deg, var(--navy-900), var(--navy-700));
    color: #fff;
    padding: 28px 20px 64px;
  }
  .header-inner { max-width: 1120px; margin: 0 auto; }
  .site-header h1 { margin: 0 0 6px; font-size: clamp(1.45rem, 3.4vw, 2rem); letter-spacing: -.01em; }
  .site-header p  { margin: 0; max-width: 62ch; color: #cfdcf5; }
  .header-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .chip {
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.2);
    padding: 4px 12px; border-radius: 999px; font-size: .85rem;
  }

  /* ---------- Layout ---------- */
  .container { max-width: 1120px; margin: -40px auto 48px; padding: 0 16px; }
  .quiz-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  /* ---------- Banners ---------- */
  .banner { padding: 12px 16px; border-radius: 10px; font-size: .92rem; margin-bottom: 16px; }
  .banner.warn { background: var(--warn-bg); color: var(--warn); border: 1px solid #f0dc9c; }
  .banner.error { background: var(--bad-bg); color: var(--bad); border: 1px solid #f1c0c0; }

  /* ---------- Progress ---------- */
  .progress-card { padding: 16px 20px; margin-bottom: 16px; }
  .progress-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .progress-top strong { font-size: 1.05rem; }
  .progress-top span { color: var(--text-soft); font-size: .9rem; }
  .progress-track { height: 10px; background: var(--blue-100); border-radius: 999px; margin-top: 10px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--blue-600), var(--blue-500)); border-radius: 999px; transition: width .35s ease; }

  /* ---------- Question card ---------- */
  .question-card { padding: 26px 26px 22px; }
  .q-label { display: inline-block; font-size: .85rem; font-weight: 600; color: var(--blue-600); background: var(--blue-100); padding: 3px 12px; border-radius: 999px; margin-bottom: 12px; }
  .q-label.ungraded { color: var(--warn); background: var(--warn-bg); }
  .q-text { font-size: clamp(1.1rem, 2.4vw, 1.3rem); font-weight: 600; margin: 0 0 20px; line-height: 1.45; }

  fieldset.options { border: 0; margin: 0; padding: 0; display: grid; gap: 10px; }
  .option {
    display: flex; align-items: flex-start; gap: 14px;
    padding: 14px 16px;
    border: 2px solid var(--line);
    border-radius: 12px;
    background: #fff;
    cursor: pointer;
    transition: border-color .15s, background-color .15s, transform .15s, box-shadow .15s;
  }
  .option:hover { border-color: var(--blue-500); background: var(--blue-50); }
  .option input { position: absolute; opacity: 0; pointer-events: none; }
  .option:focus-within { outline: 3px solid var(--blue-500); outline-offset: 2px; }
  .option .marker {
    flex: none; width: 30px; height: 30px; border-radius: 50%;
    display: grid; place-items: center; font-weight: 700; font-size: .85rem;
    background: var(--blue-100); color: var(--navy-700);
    transition: background-color .15s, color .15s;
  }
  .option .label { padding-top: 3px; }
  .option.selected { border-color: var(--blue-600); background: var(--blue-100); box-shadow: 0 0 0 3px rgba(37, 99, 201, .12); }
  .option.selected .marker { background: var(--blue-600); color: #fff; }

  .nav-buttons { display: flex; justify-content: space-between; gap: 12px; margin-top: 22px; }
  .btn {
    border: 0; border-radius: 10px; padding: 11px 20px; font-size: 1rem; font-weight: 600;
    cursor: pointer; transition: background-color .15s, transform .1s, box-shadow .15s, opacity .15s;
  }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-primary { background: var(--blue-600); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--navy-700); }
  .btn-secondary { background: #fff; color: var(--navy-700); border: 2px solid var(--line); }
  .btn-secondary:hover:not(:disabled) { border-color: var(--blue-500); background: var(--blue-50); }
  .btn-submit { background: var(--navy-900); color: #fff; width: 100%; }
  .btn-submit:hover:not(:disabled) { background: var(--navy-700); }
  .btn-link { background: none; border: 0; color: var(--text-soft); text-decoration: underline; cursor: pointer; font-size: .9rem; padding: 6px; }
  .btn-link:hover { color: var(--navy-700); }

  /* ---------- Navigator panel ---------- */
  .panel { padding: 20px; position: sticky; top: 16px; }
  .panel h2 { margin: 0 0 4px; font-size: 1.05rem; }
  .panel .summary { margin: 0 0 14px; color: var(--text-soft); font-size: .9rem; }
  .nav-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 6px; max-height: 320px; overflow-y: auto; padding: 2px; }
  .nav-btn {
    height: 40px; border-radius: 9px; border: 2px solid var(--line); background: #fff; color: var(--text-soft);
    font-weight: 600; font-size: .85rem; cursor: pointer; transition: all .15s;
  }
  .nav-btn:hover { border-color: var(--blue-500); color: var(--navy-700); }
  .nav-btn.answered { background: var(--blue-100); border-color: var(--blue-200); color: var(--navy-700); }
  .nav-btn.current { background: var(--navy-800); border-color: var(--navy-800); color: #fff; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 14px 0; font-size: .8rem; color: var(--text-soft); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 14px; height: 14px; border-radius: 4px; border: 2px solid var(--line); background: #fff; display: inline-block; }
  .legend i.answered { background: var(--blue-100); border-color: var(--blue-200); }
  .legend i.current  { background: var(--navy-800); border-color: var(--navy-800); }
  .panel-actions { display: grid; gap: 6px; margin-top: 6px; text-align: center; }

  /* ---------- Results ---------- */
  .results-head { padding: 28px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 28px; align-items: center; margin-bottom: 20px; }
  .score-ring {
    --pct: 0;
    width: 150px; height: 150px; border-radius: 50%;
    background: conic-gradient(var(--blue-600) calc(var(--pct) * 1%), var(--blue-100) 0);
    display: grid; place-items: center;
  }
  .score-ring > div { width: 118px; height: 118px; border-radius: 50%; background: #fff; display: grid; place-items: center; text-align: center; }
  .score-ring strong { font-size: 1.9rem; line-height: 1; color: var(--navy-800); }
  .score-ring small { display: block; color: var(--text-soft); font-size: .78rem; margin-top: 4px; }
  .results-head h2 { margin: 0 0 4px; font-size: 1.5rem; }
  .results-head p { margin: 0 0 14px; color: var(--text-soft); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
  .stat { padding: 10px 14px; border-radius: 10px; background: var(--blue-50); border: 1px solid var(--line); }
  .stat b { display: block; font-size: 1.35rem; color: var(--navy-800); }
  .stat span { font-size: .82rem; color: var(--text-soft); }
  .stat.good b { color: var(--good); }
  .stat.bad b { color: var(--bad); }
  .stat.warn b { color: var(--warn); }

  .review-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin: 8px 0 14px; }
  .review-toolbar h3 { margin: 0; font-size: 1.2rem; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; }
  .filter-btn { border: 2px solid var(--line); background: #fff; border-radius: 999px; padding: 5px 14px; font-size: .85rem; font-weight: 600; color: var(--text-soft); cursor: pointer; transition: all .15s; }
  .filter-btn:hover { border-color: var(--blue-500); color: var(--navy-700); }
  .filter-btn[aria-pressed="true"] { background: var(--navy-800); border-color: var(--navy-800); color: #fff; }

  .review-list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; list-style: none; margin: 0; padding: 0; }
  .review-item { padding: 20px 22px; border-left: 6px solid var(--line); }
  .review-item.correct { border-left-color: var(--good); }
  .review-item.incorrect, .review-item.unanswered { border-left-color: var(--bad); }
  .review-item.ungraded { border-left-color: var(--warn); }
  .review-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .review-top strong { color: var(--navy-700); }
  .badge { font-size: .8rem; font-weight: 700; padding: 3px 12px; border-radius: 999px; }
  .badge.correct { background: var(--good-bg); color: var(--good); }
  .badge.incorrect, .badge.unanswered { background: var(--bad-bg); color: var(--bad); }
  .badge.ungraded { background: var(--warn-bg); color: var(--warn); }
  .review-q { margin: 0 0 12px; font-weight: 600; }
  .review-options { list-style: none; margin: 0 0 12px; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .review-options li { min-width: 0; display: flex; gap: 10px; padding: 8px 12px; border-radius: 9px; border: 1px solid var(--line); font-size: .95rem; }
  .review-options li .tag { margin-left: auto; font-size: .75rem; font-weight: 700; white-space: nowrap; padding-left: 8px; }
  .review-options li.is-correct { background: var(--good-bg); border-color: #a9dcc3; }
  .review-options li.is-correct .tag { color: var(--good); }
  .review-options li.is-wrong { background: var(--bad-bg); border-color: #efbcbc; }
  .review-options li.is-wrong .tag { color: var(--bad); }
  .review-options li.is-picked-ungraded { background: var(--blue-100); border-color: var(--blue-200); }
  .review-options li.is-picked-ungraded .tag { color: var(--navy-700); }
  .review-answers { margin: 0; font-size: .9rem; color: var(--text-soft); display: grid; gap: 2px; }
  .review-answers b { color: var(--text); }
  .empty-note { text-align: center; color: var(--text-soft); padding: 28px; }
  .results-actions { display: flex; justify-content: center; margin-top: 24px; }

  /* ---------- Confirm dialog ---------- */
  dialog { border: 0; border-radius: var(--radius); padding: 24px; max-width: 420px; width: calc(100% - 32px); box-shadow: 0 20px 60px rgba(10,31,68,.35); color: var(--text); }
  dialog::backdrop { background: rgba(10, 31, 68, .55); }
  dialog h2 { margin: 0 0 8px; font-size: 1.2rem; }
  dialog p { margin: 0 0 20px; color: var(--text-soft); }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; }

  /* ---------- Responsive ---------- */
  @media (max-width: 900px) {
    .quiz-layout { grid-template-columns: 1fr; }
    .panel { position: static; }
    .nav-grid { max-height: 240px; }
  }
  @media (max-width: 560px) {
    .site-header { padding: 22px 16px 56px; }
    .question-card { padding: 20px 16px; }
    .results-head { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; padding: 22px 16px; }
    .btn { padding: 11px 14px; }
    .review-item { padding: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <h1 id="quizTitle">Quiz</h1>
    <p id="quizDescription"></p>
    <div class="header-meta" id="headerMeta"></div>
  </div>
</header>

<main class="container">
  <div id="banners"></div>

  <!-- ================= QUIZ VIEW ================= -->
  <div class="quiz-layout" id="quizView">
    <section aria-label="Quiz question">
      <div class="card progress-card">
        <div class="progress-top">
          <strong id="questionCounter" aria-live="polite">Question 1 of 1</strong>
          <span id="progressText">0 answered</span>
        </div>
        <div class="progress-track" role="progressbar" id="progressBar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Quiz progress">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <article class="card question-card">
        <span class="q-label" id="questionLabel">Question 1</span>
        <fieldset class="options" id="optionsFieldset">
          <legend class="q-text" id="questionText" dir="auto"></legend>
          <div id="optionsList" style="display:grid;gap:10px"></div>
        </fieldset>
        <div class="nav-buttons">
          <button type="button" class="btn btn-secondary" id="prevBtn">&larr; Previous</button>
          <button type="button" class="btn btn-primary" id="nextBtn">Next &rarr;</button>
        </div>
      </article>
    </section>

    <aside class="card panel" aria-label="Question navigator">
      <h2>Question navigator</h2>
      <p class="summary" id="navSummary"></p>
      <div class="nav-grid" id="navGrid"></div>
      <div class="legend" aria-hidden="true">
        <span><i class="current"></i>Current</span>
        <span><i class="answered"></i>Answered</span>
        <span><i></i>Unanswered</span>
      </div>
      <div class="panel-actions">
        <button type="button" class="btn btn-submit" id="submitBtn">Submit quiz</button>
        <button type="button" class="btn-link" id="restartLinkBtn">Restart quiz</button>
      </div>
    </aside>
  </div>

  <!-- ================= RESULTS VIEW ================= -->
  <div id="resultsView" hidden>
    <section class="card results-head" aria-labelledby="resultsTitle">
      <div class="score-ring" id="scoreRing" role="img" aria-label="Score">
        <div><span><strong id="scorePercent">0%</strong><small id="scoreFraction"></small></span></div>
      </div>
      <div>
        <h2 id="resultsTitle">Quiz results</h2>
        <p id="resultsMessage"></p>
        <div class="stats" id="statsGrid"></div>
      </div>
    </section>

    <div class="review-toolbar">
      <h3>Review answers</h3>
      <div class="filters" id="filters" role="group" aria-label="Filter review"></div>
    </div>
    <ol class="review-list" id="reviewList"></ol>

    <div class="results-actions">
      <button type="button" class="btn btn-primary" id="restartBtn">Restart quiz</button>
    </div>
  </div>
</main>

<dialog id="confirmDialog" aria-labelledby="confirmTitle">
  <h2 id="confirmTitle"></h2>
  <p id="confirmMessage"></p>
  <div class="dialog-actions">
    <button type="button" class="btn btn-secondary" id="confirmCancel">Cancel</button>
    <button type="button" class="btn btn-primary" id="confirmOk">Confirm</button>
  </div>
</dialog>

<script>
/* =========================================================================
   1. QUIZ SETTINGS + QUESTIONS  (edit this section to change the content)
   -------------------------------------------------------------------------
   Each question is an object:
     id            : any unique number (used only for your own reference)
     question      : the question text
     options       : array of answer choices (2 or more)
     correctAnswer : ZERO-BASED index of the correct option (0 = first option)
                     or null if the correct answer is not known. Questions
                     with null are shown but NOT counted in the score.
   ========================================================================= */
const quizSettings = {
  title: "Chapter 1 & 2 Assessment Quiz",
  description: "Programming Sheet, Sec 2. Choose the correct answer for each multiple-choice question, then submit to see your score and review your answers."
};

const questions = [
  {
    id: 1,
    question: "Which of the following options represents the technology or main event associated with the 1970s and 1980s?",
    options: [
      "The emergence of smartphones",
      "The spread of personal computers (PCs)",
      "The spread of cloud computing",
      "Making the Internet available for commercial use and the emergence of the Web"
    ],
    correctAnswer: 1
  },
  {
    id: 2,
    question: "Which experimental observation describes the historical trend of the number of transistors on integrated circuits increasing at a rate of approximately doubling every two years?",
    options: [
      "Cloud computing",
      "Moore's Law",
      "Quantum superposition",
      "Edge computing"
    ],
    correctAnswer: 1
  },
  {
    id: 3,
    question: "What is the term that refers to a work system in which a person performs their tasks from home or from another remote location using the internet?",
    options: [
      "Online learning",
      "E-commerce",
      "Remote work",
      "non-cash payment"
    ],
    correctAnswer: 2
  },
  {
    id: 4,
    question: "What is meant by the service \"Social Networking Services (SNS)\"?",
    options: [
      "Platforms that enable users to communicate and quickly publish and share content.",
      "Selling and purchasing goods and services over the internet.",
      "Paying for goods or services using non-cash methods.",
      "An educational platform where lessons are provided online."
    ],
    correctAnswer: 0
  },
  {
    id: 5,
    question: "Which technology processes data on the device itself immediately instead of sending it to the cloud to avoid delays in decision-making?",
    options: [
      "Cloud computing",
      "Quantum computing",
      "Edge computing",
      "Social networking services"
    ],
    correctAnswer: 2
  },
  {
    id: 6,
    question: "Which of the following options best represents the precise concept of \"Augmented Reality (AR)\"?",
    options: [
      "A technology that places the user inside a fully computer-generated virtual environment.",
      "A technology that adds digital elements or information to a scene of the real world.",
      "A computational approach that uses the properties of quantum mechanics to process information.",
      "A system for making payments with electronic money and QR codes."
    ],
    correctAnswer: 1
  },
  {
    id: 7,
    question: "What distinguishes the qubit (qubit) from the classical bit in quantum computing?",
    options: [
      "It holds a single definite state, either 0 or 1, at any time.",
      "It uses the principle of quantum superposition to be a combination of 0 and 1 at the same time.",
      "It relies only on traditional integrated circuits and steady electric current.",
      "Its use is restricted to simple calculations."
    ],
    correctAnswer: 1
  },
  {
    id: 8,
    question: "What is meant by the term \"Cashless Payment\"?",
    options: [
      "Buying and selling goods and services at physical stores using paper cash.",
      "Paying for goods or services by non-cash means such as cards, mobile apps, or QR codes.",
      "Working from home using the internet and email.",
      "Providing lessons and educational materials over the internet to users."
    ],
    correctAnswer: 1
  },
  {
    id: 9,
    question: "In which time period did the Internet begin to be available for commercial use and the Web appear, which expanded public access to information?",
    options: [
      "The 1940s and 1960s.",
      "The 1990s.",
      "The 1970s and 1980s.",
      "From the second decade of the millennium onward."
    ],
    correctAnswer: 1
  },
  {
    id: 10,
    question: "Which technology uses artificial intelligence to assist in driving a vehicle using cameras and sensors to perceive the surroundings and make decisions?",
    options: [
      "Cloud computing.",
      "Autonomous driving.",
      "Virtual reality.",
      "Quantum computing."
    ],
    correctAnswer: 1
  },
  {
    id: 11,
    question: "What term describes information technology provided as a service over the Internet to support big data analysis and artificial intelligence?",
    options: [
      "Cloud computing.",
      "Edge computing.",
      "Classical bit.",
      "Quantum correlation."
    ],
    correctAnswer: 0
  },
  {
    id: 12,
    question: "Which of the following is the correct description of the concept \"Virtual Reality (VR)\"?",
    options: [
      "A technology that overlays digital information on top of images of the real world.",
      "A technology that places the user inside a computer-generated virtual environment.",
      "A technology for processing data on the device itself immediately without the cloud.",
      "A system for making payments with electronic money and QR codes."
    ],
    correctAnswer: 1
  },
  {
    id: 13,
    question: "The time period that witnessed the emergence of smartphones and the rapid spread of the Internet via mobile phones is:",
    options: [
      "The 1960s and 1970s.",
      "The first decade of the millennium.",
      "The 1990s.",
      "The 2040s of the twenty-first centuries."
    ],
    correctAnswer: 1
  },
  {
    id: 14,
    question: "A technology that adds digital elements or information to a scene from the real world is known as:",
    options: [
      "Virtual Reality (VR).",
      "Autonomous driving.",
      "Quantum computing.",
      "Augmented Reality (AR)."
    ],
    correctAnswer: 3
  },
  {
    id: 15,
    question: "Which of the following observations accurately describes what \"Moore's Law\" does?",
    options: [
      "The number of transistors on an integrated circuit roughly doubles every two years.",
      "The number of transistors remains constant and never changes over time.",
      "The energy consumption of conventional computers doubles every year.",
      "A decline in computing and data-processing capabilities over the years."
    ],
    correctAnswer: 0
  },
  {
    id: 16,
    question: "An educational and training framework in which lessons and educational materials are delivered wholly or partly over the Internet is:",
    options: [
      "E‑commerce.",
      "Remote work.",
      "Cashless payment.",
      "Online Learning"
    ],
    correctAnswer: 3
  },
  {
    id: 17,
    question: "Computers began to appear and were used mainly for military purposes and scientific calculations, such as the ENIAC, using vacuum tubes, during the period:",
    options: [
      "1940s.",
      "1970s.",
      "1990s.",
      "the first decade of the millennium."
    ],
    correctAnswer: 0
  },
  {
    id: 18,
    question: "A computing principle or approach that uses properties of quantum mechanics to process information and may provide advantages for certain classes of problems is:",
    options: [
      "Edge computing.",
      "Quantum computing.",
      "Cashless payment.",
      "Social networking."
    ],
    correctAnswer: 1
  },
  {
    id: 19,
    question: "Platforms that allow users to communicate, publish content, and share it quickly and are very effective in disseminating information are:",
    options: [
      "Social networking sites (SNS).",
      "E-commerce.",
      "Remote work.",
      "Cloud computing."

/* =========================================================================
   2. STATE VARIABLES
   ========================================================================= */
let currentIndex = 0;      // which question is on screen
let answers = [];          // answers[i] = chosen option index for question i, or null
let isSubmitted = false;   // true once the quiz has been submitted (locks answers)
let reviewFilter = "all";  // active filter in the review list
let lastResults = null;    // cached output of calculateResults()

const OPTION_LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

/* =========================================================================
   3. SMALL HELPERS (pure functions, no DOM access)
   ========================================================================= */

/** True when a question has a usable answer key. */
function isGraded(question) {
  return Number.isInteger(question.correctAnswer) &&
         question.correctAnswer >= 0 &&
         question.correctAnswer < question.options.length;
}

/** Returns a list of problems found in the questions array (empty = all good). */
function validateQuestions(list) {
  const problems = [];
  list.forEach((q, i) => {
    const n = i + 1;
    if (!q || typeof q.question !== "string" || !q.question.trim()) problems.push("Question " + n + " has no question text.");
    else if (!Array.isArray(q.options) || q.options.length < 2) problems.push("Question " + n + " needs at least 2 options.");
    else if (q.correctAnswer !== null && !isGraded(q)) problems.push("Question " + n + " has an invalid correctAnswer (use null or a zero-based option index).");
  });
  return problems;
}

/** Creates an element with optional class and text. */
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

/** Counts how many questions have an answer selected. */
function countAnswered() {
  return answers.filter(a => a !== null).length;
}

/* =========================================================================
   4. SCORING (pure: takes questions + answers, returns numbers)
   -------------------------------------------------------------------------
   - Questions with correctAnswer === null are "ungraded" and never counted
     as correct or incorrect.
   - Percentage = correct / graded questions.
   - "Incorrect" = answered a graded question wrongly.
   - "Unanswered" = graded question left blank (counts as not correct).
   ========================================================================= */
function calculateResults(questionList, answerList) {
  const r = { total: questionList.length, graded: 0, ungraded: 0, correct: 0, incorrect: 0, unanswered: 0, percent: 0, details: [] };

  questionList.forEach((q, i) => {
    const picked = answerList[i] === undefined ? null : answerList[i];
    let status;
    if (!isGraded(q)) {
      r.ungraded++;
      status = "ungraded";
    } else {
      r.graded++;
      if (picked === null)               { r.unanswered++; status = "unanswered"; }
      else if (picked === q.correctAnswer) { r.correct++;    status = "correct"; }
      else                               { r.incorrect++;  status = "incorrect"; }
    }
    r.details.push({ index: i, picked: picked, status: status });
  });

  r.percent = r.graded > 0 ? Math.round((r.correct / r.graded) * 1000) / 10 : 0;
  return r;
}

/* =========================================================================
   5. RENDERING FUNCTIONS  (quiz view)
   ========================================================================= */
const $ = id => document.getElementById(id);

/** Header title, description and chips. */
function renderHeader() {
  $("quizTitle").textContent = quizSettings.title;
  $("quizDescription").textContent = quizSettings.description;
  document.title = quizSettings.title;
  const meta = $("headerMeta");
  meta.innerHTML = "";
  meta.appendChild(el("span", "chip", questions.length + " questions"));
  meta.appendChild(el("span", "chip", "Multiple choice"));
}

/** Banners for data problems and for questions that have no answer key. */
function renderBanners(problems) {
  const box = $("banners");
  box.innerHTML = "";
  if (problems.length) {
    box.appendChild(el("div", "banner error", "Some questions could not be loaded: " + problems.join(" ")));
  }
  const ungraded = questions.filter(q => !isGraded(q)).length;
  if (ungraded > 0) {
    box.appendChild(el("div", "banner warn", "Answer key unavailable for " + ungraded + " question" + (ungraded === 1 ? "" : "s") + ". These are shown but not included in your score."));
  }
}

/** Draws the current question and its answer choices. */
function renderQuestion() {
  const q = questions[currentIndex];
  const total = questions.length;

  $("questionCounter").textContent = "Question " + (currentIndex + 1) + " of " + total;
  const label = $("questionLabel");
  label.textContent = "Question " + (currentIndex + 1);
  label.classList.toggle("ungraded", !isGraded(q));
  if (!isGraded(q)) label.textContent += " (not graded: no answer key)";
  $("questionText").textContent = q.question;

  const list = $("optionsList");
  list.innerHTML = "";
  q.options.forEach((text, optionIndex) => {
    const label = el("label", "option");
    const input = document.createElement("input");
    input.type = "radio";
    input.name = "answer";
    input.value = String(optionIndex);
    input.checked = answers[currentIndex] === optionIndex;
    input.disabled = isSubmitted;
    input.addEventListener("change", () => selectAnswer(optionIndex));
    label.appendChild(input);
    label.appendChild(el("span", "marker", OPTION_LETTERS[optionIndex] || String(optionIndex + 1)));
    const t = el("span", "label", text);
    t.dir = "auto";
    label.appendChild(t);
    list.appendChild(label);
  });
  updateOptionHighlight();

  $("prevBtn").disabled = currentIndex === 0;
  $("nextBtn").disabled = currentIndex === total - 1;
}

/** Highlights the selected option without re-creating the inputs (keeps keyboard focus). */
function updateOptionHighlight() {
  const picked = answers[currentIndex];
  document.querySelectorAll("#optionsList .option").forEach((node, i) => {
    node.classList.toggle("selected", picked === i);
  });
}

/** Progress bar + answered counter. */
function renderProgress() {
  const total = questions.length;
  const answered = countAnswered();
  const pct = total ? Math.round((answered / total) * 100) : 0;
  $("progressFill").style.width = pct + "%";
  $("progressBar").setAttribute("aria-valuenow", String(pct));
  $("progressText").textContent = answered + " of " + total + " answered (" + pct + "%)";
}

/** Question navigator grid (jump to any question). */
function renderNavigator() {
  const grid = $("navGrid");
  grid.innerHTML = "";
  questions.forEach((q, i) => {
    const btn = el("button", "nav-btn", String(i + 1));
    btn.type = "button";
    const isAnswered = answers[i] !== null;
    if (isAnswered) btn.classList.add("answered");
    if (i === currentIndex) { btn.classList.add("current"); btn.setAttribute("aria-current", "true"); }
    btn.setAttribute("aria-label", "Go to question " + (i + 1) + (isAnswered ? ", answered" : ", unanswered"));
    btn.addEventListener("click", () => goToQuestion(i));
    grid.appendChild(btn);
  });
  const left = questions.length - countAnswered();
  $("navSummary").textContent = left === 0 ? "All questions answered." : left + " question" + (left === 1 ? "" : "s") + " still unanswered.";
}

/** Re-draws everything that depends on the current question or answers. */
function renderAll() {
  renderQuestion();
  renderProgress();
  renderNavigator();
  $("submitBtn").disabled = isSubmitted;
}

/* =========================================================================
   6. ANSWER SELECTION AND NAVIGATION
   ========================================================================= */
function selectAnswer(optionIndex) {
  if (isSubmitted) return;               // answers are locked after submission
  answers[currentIndex] = optionIndex;
  updateOptionHighlight();
  renderProgress();
  renderNavigator();
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  currentIndex = index;
  renderAll();
}

function goNext()     { goToQuestion(currentIndex + 1); }
function goPrevious() { goToQuestion(currentIndex - 1); }

/** Promise-based confirm dialog (falls back to window.confirm on old browsers). */
function askConfirm(title, message, okLabel) {
  const dlg = $("confirmDialog");
  if (typeof dlg.showModal !== "function") return Promise.resolve(window.confirm(title + "\n\n" + message));
  $("confirmTitle").textContent = title;
  $("confirmMessage").textContent = message;
  $("confirmOk").textContent = okLabel || "Confirm";
  return new Promise(resolve => {
    const done = value => { dlg.removeEventListener("close", onClose); dlg.close(); resolve(value); };
    const onClose = () => resolve(false);          // Esc key
    $("confirmOk").onclick = () => done(true);
    $("confirmCancel").onclick = () => done(false);
    dlg.addEventListener("close", onClose);
    dlg.showModal();
  });
}

/* =========================================================================
   7. QUIZ SUBMISSION
   ========================================================================= */
async function handleSubmitClick() {
  if (isSubmitted) return;               // guard against double submission
  const unanswered = questions.length - countAnswered();
  const message = unanswered > 0
    ? "You have " + unanswered + " unanswered question" + (unanswered === 1 ? "" : "s") + ". Unanswered questions score no marks. Submit anyway?"
    : "You have answered every question. Once submitted you cannot change your answers.";
  const ok = await askConfirm("Submit quiz?", message, "Submit quiz");
  if (ok) submitQuiz();
}

function submitQuiz() {
  if (isSubmitted) return;               // second guard: never score twice
  isSubmitted = true;
  $("submitBtn").disabled = true;
  lastResults = calculateResults(questions, answers);
  showResults();
}

/* =========================================================================
   8. RESULTS AND ANSWER REVIEW
   ========================================================================= */
function showResults() {
  $("quizView").hidden = true;
  $("resultsView").hidden = false;
  renderResultsSummary();
  reviewFilter = "all";
  renderFilters();
  renderReview();
  window.scrollTo(0, 0);
}

function renderResultsSummary() {
  const r = lastResults;
  $("scorePercent").textContent = r.graded ? r.percent + "%" : "N/A";
  $("scoreFraction").textContent = r.graded ? r.correct + " / " + r.graded : "no graded questions";
  $("scoreRing").style.setProperty("--pct", String(r.graded ? r.percent : 0));
  $("scoreRing").setAttribute("aria-label", r.graded ? "Score " + r.percent + " percent" : "No graded questions");

  let message;
  if (!r.graded) message = "None of the questions have an answer key, so no score could be calculated.";
  else if (r.percent >= 85) message = "Excellent work. You have a strong grasp of this material.";
  else if (r.percent >= 65) message = "Good effort. Review the questions you missed to close the gaps.";
  else message = "Keep practising. Use the review below to study the correct answers.";
  if (r.ungraded) message += " " + r.ungraded + " question" + (r.ungraded === 1 ? " was" : "s were") + " not graded (no answer key).";
  $("resultsMessage").textContent = message;

  const stats = [
    ["Graded questions", r.graded, ""],
    ["Correct", r.correct, "good"],
    ["Incorrect", r.incorrect, "bad"],
    ["Unanswered", r.unanswered, "bad"]
  ];
  if (r.ungraded) stats.push(["Not graded", r.ungraded, "warn"]);
  const grid = $("statsGrid");
  grid.innerHTML = "";
  stats.forEach(([label, value, kind]) => {
    const box = el("div", "stat" + (kind ? " " + kind : ""));
    box.appendChild(el("b", "", String(value)));
    box.appendChild(el("span", "", label));
    grid.appendChild(box);
  });
}

const FILTERS = [
  { key: "all", label: "All" },
  { key: "correct", label: "Correct" },
  { key: "incorrect", label: "Incorrect" },
  { key: "unanswered", label: "Unanswered" },
  { key: "ungraded", label: "Not graded" }
];

function renderFilters() {
  const box = $("filters");
  box.innerHTML = "";
  FILTERS.forEach(f => {
    if (f.key === "ungraded" && lastResults.ungraded === 0) return;   // hide when not relevant
    const count = f.key === "all" ? lastResults.total : lastResults[f.key === "ungraded" ? "ungraded" : f.key];
    const btn = el("button", "filter-btn", f.label + " (" + count + ")");
    btn.type = "button";
    btn.setAttribute("aria-pressed", String(reviewFilter === f.key));
    btn.addEventListener("click", () => { reviewFilter = f.key; renderFilters(); renderReview(); });
    box.appendChild(btn);
  });
}

const STATUS_TEXT = { correct: "Correct", incorrect: "Incorrect", unanswered: "Not answered", ungraded: "Not graded" };

function optionText(q, index) {
  return index === null ? "No answer" : OPTION_LETTERS[index] + ". " + q.options[index];
}

function renderReview() {
  const list = $("reviewList");
  list.innerHTML = "";
  const items = lastResults.details.filter(d => reviewFilter === "all" || d.status === reviewFilter);
  if (!items.length) {
    const li = el("li", "card empty-note", "No questions in this category.");
    list.appendChild(li);
    return;
  }

  items.forEach(d => {
    const q = questions[d.index];
    const item = el("li", "card review-item " + d.status);

    const top = el("div", "review-top");
    top.appendChild(el("strong", "", "Question " + (d.index + 1)));
    top.appendChild(el("span", "badge " + d.status, STATUS_TEXT[d.status]));
    item.appendChild(top);

    const qText = el("p", "review-q", q.question);
    qText.dir = "auto";
    item.appendChild(qText);

    const opts = el("ul", "review-options");
    q.options.forEach((text, i) => {
      const li = el("li");
      li.appendChild(el("span", "", OPTION_LETTERS[i] + "."));
      const t = el("span", "", text);
      t.dir = "auto";
      li.appendChild(t);
      const isCorrect = isGraded(q) && i === q.correctAnswer;
      const isPicked = d.picked === i;
      if (isCorrect)                    { li.classList.add("is-correct"); li.appendChild(el("span", "tag", isPicked ? "Your answer · Correct" : "Correct answer")); }
      else if (isPicked && isGraded(q)) { li.classList.add("is-wrong");   li.appendChild(el("span", "tag", "Your answer")); }
      else if (isPicked)                { li.classList.add("is-picked-ungraded"); li.appendChild(el("span", "tag", "Your answer")); }
      opts.appendChild(li);
    });
    item.appendChild(opts);

    const summary = el("div", "review-answers");
    const yours = el("span"); yours.appendChild(el("b", "", "Your answer: ")); yours.appendChild(document.createTextNode(optionText(q, d.picked)));
    const right = el("span"); right.appendChild(el("b", "", "Correct answer: "));
    right.appendChild(document.createTextNode(isGraded(q) ? optionText(q, q.correctAnswer) : "Answer key unavailable"));
    summary.appendChild(yours);
    summary.appendChild(right);
    item.appendChild(summary);

    list.appendChild(item);
  });
}

/* =========================================================================
   9. RESTART
   ========================================================================= */
function resetQuiz() {
  currentIndex = 0;
  answers = questions.map(() => null);
  isSubmitted = false;
  lastResults = null;
  reviewFilter = "all";
  $("resultsView").hidden = true;
  $("quizView").hidden = false;
  $("submitBtn").disabled = false;
  renderAll();
  window.scrollTo(0, 0);
}

async function handleRestartClick() {
  // No need to ask after submission; ask if the student would lose answers.
  if (!isSubmitted && countAnswered() > 0) {
    const ok = await askConfirm("Restart quiz?", "All your current answers will be cleared.", "Restart");
    if (!ok) return;
  }
  resetQuiz();
}

/* =========================================================================
   10. START UP
   ========================================================================= */
function initQuiz() {
  const problems = validateQuestions(questions);
  renderHeader();
  renderBanners(problems);

  if (problems.length || questions.length === 0) {
    $("quizView").hidden = true;
    if (!questions.length) $("banners").appendChild(el("div", "banner error", "There are no questions to show. Add questions to the questions array."));
    return;
  }

  $("prevBtn").addEventListener("click", goPrevious);
  $("nextBtn").addEventListener("click", goNext);
  $("submitBtn").addEventListener("click", handleSubmitClick);
  $("restartLinkBtn").addEventListener("click", handleRestartClick);
  $("restartBtn").addEventListener("click", handleRestartClick);

  // Keyboard shortcuts: left/right arrows move between questions (not while a dialog is open)
  document.addEventListener("keydown", e => {
    if (isSubmitted || $("confirmDialog").open) return;
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === "ArrowRight" && e.target.type !== "radio") goNext();
    if (e.key === "ArrowLeft" && e.target.type !== "radio") goPrevious();
  });

  resetQuiz();
}

if (typeof document !== "undefined" && document.getElementById("quizView")) initQuiz();
</script>
